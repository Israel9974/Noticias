
name: Prueba Viernes

on:
  schedule:
    - cron: '0 10 * * 1'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias-actualizacion
  cancel-in-progress: false

jobs:
  ejecutar-noticias:
    name: Ejecutar scrapers
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Piura
        run: |
          python main_Piura.py

      - name: Ejecutar Lambayeque
        run: |
          python main_Lambayeque.py

      - name: Guardar archivos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Data/

          if git diff --cached --quiet; then
            echo "No hay archivos nuevos para guardar."
            exit 0
          fi

          git commit -m "Actualización automática de noticias"

          git pull --rebase origin main

          git push origin main
