name: Guardar datos en Storage

on:
  workflow_run:
    workflows:
      - "Prueba Viernes"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

jobs:

  guardar-storage:

    # Solo ejecutar automáticamente si "Prueba Viernes"
    # terminó correctamente.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. DESCARGAR EL REPOSITORIO PRINCIPAL
      # =====================================================

      - name: Descargar repositorio de noticias
        uses: actions/checkout@v4


      # =====================================================
      # 2. MOSTRAR LOS ARCHIVOS DISPONIBLES
      # =====================================================

      - name: Revisar archivos generados
        run: |

          echo "=========================================="
          echo "ARCHIVOS DISPONIBLES"
          echo "=========================================="

          if [ -d "Data" ]; then
            find Data -type f -print
          else
            echo "⚠ No existe la carpeta Data"
          fi


      # =====================================================
      # 3. CLONAR STORAGE
      # =====================================================

      - name: Descargar repositorio Storage
        env:
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}
        run: |

          git clone \
            https://x-access-token:${STORAGE_TOKEN}@github.com/Israel9974/Storage.git \
            storage


      # =====================================================
      # 4. CREAR CARPETAS DE DESTINO
      # =====================================================

      - name: Crear carpetas de Storage
        run: |

          mkdir -p storage/noticias/Piura
          mkdir -p storage/noticias/Lambayeque


      # =====================================================
      # 5. COPIAR PIURA
      # =====================================================

      - name: Copiar datos de Piura
        run: |

          if [ -d "Data/Piura" ]; then

            echo "=========================================="
            echo "COPIANDO PIURA"
            echo "=========================================="

            cp -r Data/Piura/* storage/noticias/Piura/ || true

            echo "✓ Datos de Piura copiados."

          else

            echo "⚠ No existe Data/Piura"

          fi


      # =====================================================
      # 6. COPIAR LAMBAYEQUE
      # =====================================================

      - name: Copiar datos de Lambayeque
        run: |

          if [ -d "Data/Lambayeque" ]; then

            echo "=========================================="
            echo "COPIANDO LAMBAYEQUE"
            echo "=========================================="

            cp -r Data/Lambayeque/* storage/noticias/Lambayeque/ || true

            echo "✓ Datos de Lambayeque copiados."

          else

            echo "⚠ No existe Data/Lambayeque"

          fi


      # =====================================================
      # 7. CONFIGURAR GIT
      # =====================================================

      - name: Configurar Git
        working-directory: storage
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


      # =====================================================
      # 8. MOSTRAR CAMBIOS
      # =====================================================

      - name: Revisar cambios
        working-directory: storage
        run: |

          echo "=========================================="
          echo "CAMBIOS EN STORAGE"
          echo "=========================================="

          git status --short


      # =====================================================
      # 9. GUARDAR CAMBIOS
      # =====================================================

      - name: Guardar archivos en Storage
        working-directory: storage
        run: |

          git add noticias/

          if git diff --cached --quiet; then

            echo "=========================================="
            echo "NO HAY ARCHIVOS NUEVOS"
            echo "=========================================="

            echo "Storage ya contiene los datos actuales."

          else

            echo "=========================================="
            echo "GUARDANDO NUEVOS ARCHIVOS"
            echo "=========================================="

            git commit \
              -m "Actualizar almacenamiento de noticias"

            git push

            echo "=========================================="
            echo "✓ STORAGE ACTUALIZADO"
            echo "=========================================="

          fi
