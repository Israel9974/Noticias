name: Guardar datos en Storage

on:
  workflow_run:
    workflows:
      - "Prueba Viernes"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

jobs:

  guardar-storage:

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. DESCARGAR REPOSITORIO PRINCIPAL
      # =====================================================

      - name: Descargar repositorio de noticias
        uses: actions/checkout@v4


      # =====================================================
      # 2. MOSTRAR DATA
      # =====================================================

      - name: Revisar archivos generados
        run: |

          echo "=========================================="
          echo "ARCHIVOS EN DATA"
          echo "=========================================="

          find Data -type f -print


      # =====================================================
      # 3. CLONAR STORAGE
      # =====================================================

      - name: Descargar repositorio Storage
        env:
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}
        run: |

          git clone \
            https://x-access-token:${STORAGE_TOKEN}@github.com/Israel9974/Storage.git \
            storage


      # =====================================================
      # 4. CREAR ESTRUCTURA DE STORAGE
      # =====================================================

      - name: Crear carpetas
        run: |

          mkdir -p storage/noticias/piura/excel
          mkdir -p storage/noticias/piura/parquet

          mkdir -p storage/noticias/lambayeque/excel
          mkdir -p storage/noticias/lambayeque/parquet


      # =====================================================
      # 5. COPIAR EXCEL DE PIURA
      # =====================================================

      - name: Copiar Excel de Piura
        run: |

          echo "=========================================="
          echo "EXCEL - PIURA"
          echo "=========================================="

          find Data/Piura \
            -maxdepth 1 \
            -type f \
            -name "*.xlsx" \
            -exec cp {} storage/noticias/piura/excel/ \;

          echo "Archivos Excel de Piura:"

          find storage/noticias/piura/excel \
            -type f \
            -name "*.xlsx"


      # =====================================================
      # 6. COPIAR PARQUET DE PIURA
      # =====================================================

      - name: Copiar Parquet de Piura
        run: |

          echo "=========================================="
          echo "PARQUET - PIURA"
          echo "=========================================="

          find Data/Piura \
            -type f \
            -name "*.parquet" \
            -exec cp {} storage/noticias/piura/parquet/ \;

          echo "Archivos Parquet de Piura:"

          find storage/noticias/piura/parquet \
            -type f \
            -name "*.parquet"


      # =====================================================
      # 7. COPIAR EXCEL DE LAMBAYEQUE
      # =====================================================

      - name: Copiar Excel de Lambayeque
        run: |

          echo "=========================================="
          echo "EXCEL - LAMBAYEQUE"
          echo "=========================================="

          find Data/Lambayeque \
            -maxdepth 1 \
            -type f \
            -name "*.xlsx" \
            -exec cp {} storage/noticias/lambayeque/excel/ \;

          echo "Archivos Excel de Lambayeque:"

          find storage/noticias/lambayeque/excel \
            -type f \
            -name "*.xlsx"


      # =====================================================
      # 8. COPIAR PARQUET DE LAMBAYEQUE
      # =====================================================

      - name: Copiar Parquet de Lambayeque
        run: |

          echo "=========================================="
          echo "PARQUET - LAMBAYEQUE"
          echo "=========================================="

          find Data/Lambayeque \
            -type f \
            -name "*.parquet" \
            -exec cp {} storage/noticias/lambayeque/parquet/ \;

          echo "Archivos Parquet de Lambayeque:"

          find storage/noticias/lambayeque/parquet \
            -type f \
            -name "*.parquet"


      # =====================================================
      # 9. CONFIGURAR GIT
      # =====================================================

      - name: Configurar Git
        working-directory: storage
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


      # =====================================================
      # 10. MOSTRAR CAMBIOS
      # =====================================================

      - name: Revisar cambios
        working-directory: storage
        run: |

          echo "=========================================="
          echo "CAMBIOS EN STORAGE"
          echo "=========================================="

          git status --short


      # =====================================================
      # 11. GUARDAR CAMBIOS
      # =====================================================

      - name: Guardar archivos en Storage
        working-directory: storage
        run: |

          git add noticias/

          if git diff --cached --quiet; then

            echo "=========================================="
            echo "NO HAY CAMBIOS NUEVOS"
            echo "=========================================="

          else

            echo "=========================================="
            echo "GUARDANDO ARCHIVOS"
            echo "=========================================="

            git commit \
              -m "Actualizar almacenamiento de noticias"

            git push

            echo "=========================================="
            echo "✓ STORAGE ACTUALIZADO"
            echo "=========================================="

          fi
