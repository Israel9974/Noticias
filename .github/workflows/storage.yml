name: Guardar datos en Storage

on:
  workflow_run:
    workflows:
      - "Prueba Viernes"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

jobs:

  guardar-storage:

    # =====================================================
    # EJECUTAR SOLO SI PRUEBA VIERNES TERMINÓ BIEN
    # =====================================================

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. DESCARGAR REPOSITORIO PRINCIPAL
      # =====================================================

      - name: Descargar repositorio de noticias
        uses: actions/checkout@v4


      # =====================================================
      # 2. MOSTRAR ARCHIVOS DISPONIBLES
      # =====================================================

      - name: Revisar archivos generados
        run: |

          echo "=========================================="
          echo "ARCHIVOS EN DATA"
          echo "=========================================="

          if [ -d "Data" ]; then
            find Data -type f -print
          else
            echo "⚠ No existe la carpeta Data"
          fi


      # =====================================================
      # 3. CLONAR REPOSITORIO STORAGE
      # =====================================================

      - name: Descargar repositorio Storage
        env:
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}
        run: |

          echo "=========================================="
          echo "DESCARGANDO STORAGE"
          echo "=========================================="

          git clone \
            https://x-access-token:${STORAGE_TOKEN}@github.com/Israel9974/Storage.git \
            storage_repo

          echo "✓ Storage descargado correctamente."


      # =====================================================
      # 4. CREAR ESTRUCTURA DE CARPETAS
      # =====================================================

      - name: Crear carpetas de Storage
        run: |

          echo "=========================================="
          echo "CREANDO ESTRUCTURA"
          echo "=========================================="

          mkdir -p storage_repo/noticias/piura/excel
          mkdir -p storage_repo/noticias/piura/parquet

          mkdir -p storage_repo/noticias/lambayeque/excel
          mkdir -p storage_repo/noticias/lambayeque/parquet

          echo "✓ Estructura preparada."


      # =====================================================
      # 5. COPIAR EXCEL DE PIURA
      # =====================================================

      - name: Copiar Excel de Piura
        run: |

          echo "=========================================="
          echo "EXCEL - PIURA"
          echo "=========================================="

          if [ -d "Data/Piura" ]; then

            find Data/Piura \
              -maxdepth 1 \
              -type f \
              -name "*.xlsx" \
              -exec cp {} storage_repo/noticias/piura/excel/ \;

            echo "✓ Excel de Piura copiado."

          else

            echo "⚠ No existe Data/Piura."

          fi


      # =====================================================
      # 6. COPIAR PARQUET DE PIURA
      # =====================================================

      - name: Copiar Parquet de Piura
        run: |

          echo "=========================================="
          echo "PARQUET - PIURA"
          echo "=========================================="

          if [ -d "Data/Piura" ]; then

            find Data/Piura \
              -type f \
              -name "*.parquet" \
              -exec cp {} storage_repo/noticias/piura/parquet/ \;

            echo "✓ Parquet de Piura copiado."

          else

            echo "⚠ No existe Data/Piura."

          fi


      # =====================================================
      # 7. COPIAR EXCEL DE LAMBAYEQUE
      # =====================================================

      - name: Copiar Excel de Lambayeque
        run: |

          echo "=========================================="
          echo "EXCEL - LAMBAYEQUE"
          echo "=========================================="

          if [ -d "Data/Lambayeque" ]; then

            find Data/Lambayeque \
              -maxdepth 1 \
              -type f \
              -name "*.xlsx" \
              -exec cp {} storage_repo/noticias/lambayeque/excel/ \;

            echo "✓ Excel de Lambayeque copiado."

          else

            echo "⚠ No existe Data/Lambayeque."

          fi


      # =====================================================
      # 8. COPIAR PARQUET DE LAMBAYEQUE
      # =====================================================

      - name: Copiar Parquet de Lambayeque
        run: |

          echo "=========================================="
          echo "PARQUET - LAMBAYEQUE"
          echo "=========================================="

          if [ -d "Data/Lambayeque" ]; then

            find Data/Lambayeque \
              -type f \
              -name "*.parquet" \
              -exec cp {} storage_repo/noticias/lambayeque/parquet/ \;

            echo "✓ Parquet de Lambayeque copiado."

          else

            echo "⚠ No existe Data/Lambayeque."

          fi


      # =====================================================
      # 9. MOSTRAR ESTRUCTURA FINAL
      # =====================================================

      - name: Revisar archivos en Storage
        run: |

          echo "=========================================="
          echo "ARCHIVOS EN STORAGE"
          echo "=========================================="

          find storage_repo/noticias -type f -print


      # =====================================================
      # 10. CONFIGURAR GIT
      # =====================================================

      - name: Configurar Git
        working-directory: storage_repo
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


      # =====================================================
      # 11. REVISAR CAMBIOS
      # =====================================================

      - name: Revisar cambios
        working-directory: storage_repo
        run: |

          echo "=========================================="
          echo "CAMBIOS DETECTADOS"
          echo "=========================================="

          git status --short


      # =====================================================
      # 12. GUARDAR CAMBIOS EN STORAGE
      # =====================================================

      - name: Guardar archivos en Storage
        working-directory: storage_repo
        run: |

          echo "=========================================="
          echo "GUARDANDO CAMBIOS"
          echo "=========================================="

          git add noticias/

          if git diff --cached --quiet; then

            echo "No hay archivos nuevos o modificados."

          else

            git commit \
              -m "Actualizar almacenamiento de noticias"

            git push

            echo "=========================================="
            echo "✓ STORAGE ACTUALIZADO CORRECTAMENTE"
            echo "=========================================="

          fi
