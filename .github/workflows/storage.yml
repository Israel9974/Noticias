name: Guardar datos en Storage

on:
  workflow_run:
    workflows:
      - "Prueba Viernes"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read


jobs:

  guardar-storage:

    # =====================================================
    # EJECUTAR SOLO SI PRUEBA VIERNES TERMINÓ BIEN
    # =====================================================

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest


    steps:

      # =====================================================
      # 1. DESCARGAR REPOSITORIO PRINCIPAL
      # =====================================================

      - name: Descargar repositorio de noticias
        uses: actions/checkout@v4


      # =====================================================
      # 2. MOSTRAR ARCHIVOS DISPONIBLES
      # =====================================================

      - name: Revisar archivos generados
        run: |

          echo "=========================================="
          echo "ARCHIVOS EN DATA"
          echo "=========================================="

          if [ -d "Data" ]; then
            find Data -type f -print
          else
            echo "⚠ No existe la carpeta Data"
          fi


      # =====================================================
      # 3. INSTALAR PYTHON Y DEPENDENCIAS
      # =====================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Instalar pandas y pyarrow
        run: |

          python -m pip install --upgrade pip

          pip install pandas pyarrow


      # =====================================================
      # 4. CLONAR REPOSITORIO STORAGE
      # =====================================================

      - name: Descargar repositorio Storage
        env:
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}

        run: |

          echo "=========================================="
          echo "DESCARGANDO STORAGE"
          echo "=========================================="

          git clone \
            https://x-access-token:${STORAGE_TOKEN}@github.com/Israel9974/Storage.git \
            storage_repo

          echo "✓ Storage descargado correctamente."


      # =====================================================
      # 5. CREAR ESTRUCTURA DE CARPETAS
      # =====================================================

      - name: Crear carpetas de Storage
        run: |

          echo "=========================================="
          echo "CREANDO ESTRUCTURA"
          echo "=========================================="

          mkdir -p storage_repo/noticias/piura/excel
          mkdir -p storage_repo/noticias/piura/parquet

          mkdir -p storage_repo/noticias/lambayeque/excel
          mkdir -p storage_repo/noticias/lambayeque/parquet

          echo "✓ Estructura preparada."


      # =====================================================
      # 6. COPIAR EXCEL DE PIURA
      # =====================================================

      - name: Copiar Excel de Piura
        run: |

          echo "=========================================="
          echo "EXCEL - PIURA"
          echo "=========================================="

          if [ -d "Data/Piura" ]; then

            find Data/Piura \
              -maxdepth 1 \
              -type f \
              -name "*.xlsx" \
              -exec cp {} storage_repo/noticias/piura/excel/ \;

            echo "✓ Excel de Piura copiado."

          else

            echo "⚠ No existe Data/Piura."

          fi


      # =====================================================
      # 7. COPIAR PARQUET DE PIURA
      # =====================================================

      - name: Copiar Parquet de Piura
        run: |

          echo "=========================================="
          echo "PARQUET - PIURA"
          echo "=========================================="

          if [ -d "Data/Piura" ]; then

            find Data/Piura \
              -type f \
              -name "*.parquet" \
              -exec cp {} storage_repo/noticias/piura/parquet/ \;

            echo "✓ Parquet de Piura copiado."

          else

            echo "⚠ No existe Data/Piura."

          fi


      # =====================================================
      # 8. COPIAR EXCEL DE LAMBAYEQUE
      # =====================================================

      - name: Copiar Excel de Lambayeque
        run: |

          echo "=========================================="
          echo "EXCEL - LAMBAYEQUE"
          echo "=========================================="

          if [ -d "Data/Lambayeque" ]; then

            find Data/Lambayeque \
              -maxdepth 1 \
              -type f \
              -name "*.xlsx" \
              -exec cp {} storage_repo/noticias/lambayeque/excel/ \;

            echo "✓ Excel de Lambayeque copiado."

          else

            echo "⚠ No existe Data/Lambayeque."

          fi


      # =====================================================
      # 9. COPIAR PARQUET DE LAMBAYEQUE
      # =====================================================

      - name: Copiar Parquet de Lambayeque
        run: |

          echo "=========================================="
          echo "PARQUET - LAMBAYEQUE"
          echo "=========================================="

          if [ -d "Data/Lambayeque" ]; then

            find Data/Lambayeque \
              -type f \
              -name "*.parquet" \
              -exec cp {} storage_repo/noticias/lambayeque/parquet/ \;

            echo "✓ Parquet de Lambayeque copiado."

          else

            echo "⚠ No existe Data/Lambayeque."

          fi


      # =====================================================
      # 10. CREAR PARQUETS CONSOLIDADOS
      # =====================================================

      - name: Generar Parquet consolidados
        run: |

          echo "=========================================="
          echo "GENERANDO PARQUETS CONSOLIDADOS"
          echo "=========================================="

          python <<'PY'

          import os
          import pandas as pd


          # =================================================
          # FUNCIÓN PARA CONSOLIDAR UNA REGIÓN
          # =================================================

          def consolidar_region(region):

              carpeta = (
                  f"storage_repo/noticias/"
                  f"{region}/parquet"
              )

              archivo_salida = (
                  f"noticias_{region}_consolidado.parquet"
              )

              ruta_salida = os.path.join(
                  carpeta,
                  archivo_salida
              )


              print()
              print("=" * 60)
              print(
                  f"CONSOLIDANDO: "
                  f"{region.upper()}"
              )
              print("=" * 60)


              # =============================================
              # VERIFICAR CARPETA
              # =============================================

              if not os.path.exists(carpeta):

                  print(
                      f"⚠ No existe: {carpeta}"
                  )

                  return


              # =============================================
              # BUSCAR PARQUETS
              # =============================================

              archivos = []

              for nombre in os.listdir(carpeta):

                  if not nombre.lower().endswith(
                      ".parquet"
                  ):
                      continue

                  # No incluir el consolidado
                  if nombre == archivo_salida:
                      continue

                  archivos.append(nombre)


              archivos.sort()


              print(
                  f"Parquets encontrados: "
                  f"{len(archivos)}"
              )


              # =============================================
              # SI NO HAY ARCHIVOS
              # =============================================

              if not archivos:

                  print(
                      "⚠ No hay Parquet para consolidar."
                  )

                  return


              # =============================================
              # LEER TODOS LOS PARQUETS
              # =============================================

              tablas = []

              for nombre in archivos:

                  ruta = os.path.join(
                      carpeta,
                      nombre
                  )

                  print(
                      f"Leyendo: {nombre}"
                  )

                  try:

                      df = pd.read_parquet(
                          ruta
                      )

                      # =====================================
                      # AGREGAR NOMBRE DEL ARCHIVO ORIGINAL
                      # =====================================

                      df["ARCHIVO_ORIGEN"] = nombre

                      tablas.append(df)

                      print(
                          f"  ✓ {len(df)} filas"
                      )

                  except Exception as error:

                      print(
                          f"  ⚠ ERROR leyendo "
                          f"{nombre}: {error}"
                      )


              # =============================================
              # VERIFICAR DATOS
              # =============================================

              if not tablas:

                  print(
                      "⚠ No se pudo leer ningún Parquet."
                  )

                  return


              # =============================================
              # UNIR TODOS
              # =============================================

              consolidado = pd.concat(
                  tablas,
                  ignore_index=True
              )


              # =============================================
              # ELIMINAR DUPLICADOS EXACTOS
              # =============================================

              antes = len(consolidado)

              consolidado = consolidado.drop_duplicates(
                  ignore_index=True
              )

              despues = len(consolidado)


              if antes != despues:

                  print(
                      f"Duplicados eliminados: "
                      f"{antes - despues}"
                  )


              # =============================================
              # GUARDAR
              # =============================================

              consolidado.to_parquet(
                  ruta_salida,
                  index=False
              )


              print()
              print(
                  f"✓ Consolidado generado:"
              )

              print(
                  f"  {ruta_salida}"
              )

              print(
                  f"  Filas: {len(consolidado)}"
              )

              print(
                  f"  Columnas: "
                  f"{len(consolidado.columns)}"
              )


              print()
              print(
                  "Columnas:"
              )

              for columna in consolidado.columns:

                  print(
                      f"  - {columna}"
                  )


          # =================================================
          # PIURA
          # =================================================

          consolidar_region(
              "piura"
          )


          # =================================================
          # LAMBAYEQUE
          # =================================================

          consolidar_region(
              "lambayeque"
          )


          print()
          print("=" * 60)
          print(
              "✓ CONSOLIDACIÓN TERMINADA"
          )
          print("=" * 60)

          PY


      # =====================================================
      # 11. MOSTRAR ESTRUCTURA FINAL
      # =====================================================

      - name: Revisar archivos en Storage
        run: |

          echo "=========================================="
          echo "ARCHIVOS EN STORAGE"
          echo "=========================================="

          find storage_repo/noticias \
            -type f \
            -print


      # =====================================================
      # 12. CONFIGURAR GIT
      # =====================================================

      - name: Configurar Git
        working-directory: storage_repo
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


      # =====================================================
      # 13. REVISAR CAMBIOS
      # =====================================================

      - name: Revisar cambios
        working-directory: storage_repo
        run: |

          echo "=========================================="
          echo "CAMBIOS DETECTADOS"
          echo "=========================================="

          git status --short


      # =====================================================
      # 14. GUARDAR CAMBIOS EN STORAGE
      # =====================================================

      - name: Guardar archivos en Storage
        working-directory: storage_repo
        run: |

          echo "=========================================="
          echo "GUARDANDO CAMBIOS"
          echo "=========================================="

          git add noticias/

          if git diff --cached --quiet; then

            echo "No hay archivos nuevos o modificados."

          else

            git commit \
              -m "Actualizar almacenamiento de noticias"

            git push

            echo "=========================================="
            echo "✓ STORAGE ACTUALIZADO CORRECTAMENTE"
            echo "=========================================="

          fi
