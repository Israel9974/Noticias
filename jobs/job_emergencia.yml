name: Job Emergencia

on:
  workflow_dispatch:

jobs:
  ejecutar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml openpyxl

      - name: Ejecutar Piura
        run: |
          python main_Piura.py

      - name: Ejecutar Lambayeque
        run: |
          python main_Lambayeque.py

      - name: Guardar archivos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Data/

          git diff --cached --quiet || git commit -m "Actualización automática de noticias"

          git push
